name: lab_patgtl
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  provider: ^6.0.5
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# =========================
# FLUTTER CONFIG
# =========================
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/app_icon.png
    - assets/geophysics.png
    - assets/sea.png
    - assets/erosion.png
    - assets/inventory.png
    - assets/handshake.png
    - assets/loading-bar.png
    - assets/file.png
    - assets/optimizing.png
    - assets/geolistrik.png
    - assets/seismik.png
    - assets/gravity.png
    - assets/elektro.png
    - assets/bor.png
    - assets/perlengkapan.png
    - assets/adduser.png
    - assets/search.png

# =========================
# SPLASH SCREEN CONFIG
# =========================
flutter_native_splash:
  color: "#181818"
  image: assets/logo.png

  android: true
  ios: true

  android_12:
    image: assets/logo.png
    icon_background_color: "#181818"

# =========================
# APP ICON CONFIG
# =========================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  adaptive_icon_background: "#181818"
  adaptive_icon_foreground: assets/app_icon.png
